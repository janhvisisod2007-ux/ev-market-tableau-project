<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EV Market Performance &amp; Insights</title>
  <script type="module"
          src="https://public.tableau.com/javascripts/api/tableau.embedding.3.latest.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f8; color: #222; }
    header { background: #0b3d5c; color: #fff; padding: 16px 24px; }
    header h1 { margin: 0; font-size: 22px; }
    nav { display: flex; gap: 8px; padding: 12px 24px; background: #fff; border-bottom: 1px solid #ddd; }
    nav button { padding: 8px 18px; border: 1px solid #0b3d5c; background: #fff;
                 color: #0b3d5c; border-radius: 4px; cursor: pointer; font-size: 14px; }
    nav button.active { background: #0b3d5c; color: #fff; }
    .panel { display: none; padding: 16px 24px; }
    .panel.active { display: block; }
    tableau-viz { width: 100%; }
  </style>
</head>
<body>
  <header>
    <h1>Electric Vehicle Market Performance &amp; Insights</h1>
  </header>

  <nav>
    <button class="active" data-target="dashboard">Dashboard</button>
    <button data-target="analysis">Advanced Analysis</button>
    <button data-target="story">Story</button>
  </nav>

  <section id="dashboard" class="panel active">
    <tableau-viz src="{{ dashboard_url }}" width="100%" height="1400"
                 toolbar="bottom" hide-tabs></tableau-viz>
  </section>

  <section id="analysis" class="panel">
    <tableau-viz src="{{ analysis_url }}" width="100%" height="1000"
                 toolbar="bottom" hide-tabs></tableau-viz>
  </section>

  <section id="story" class="panel">
    <tableau-viz src="{{ story_url }}" width="100%" height="900"
                 toolbar="bottom" hide-tabs></tableau-viz>
  </section>

  <script>
    document.querySelectorAll("nav button").forEach(function (btn) {
      btn.addEventListener("click", function () {
        document.querySelectorAll("nav button").forEach(function (b) { b.classList.remove("active"); });
        document.querySelectorAll(".panel").forEach(function (p) { p.classList.remove("active"); });
        btn.classList.add("active");
        document.getElementById(btn.dataset.target).classList.add("active");
      });
    });
  </script>
</body>
</html>
